global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # O próprio Prometheus
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # A aplicação FastAPI roda no host via uvicorn (porta 8000).
  # host.docker.internal resolve para o host a partir do contêiner,
  # graças ao extra_hosts configurado no docker-compose.yml.
  - job_name: "langchain-app"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
